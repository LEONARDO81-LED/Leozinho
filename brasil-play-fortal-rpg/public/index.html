<!DOCTYPE html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Brasil Play Fortal RPG</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07040d;--pn:#120a1f;--pn2:#1a0f2e;--bd:#2c1a4a;--ac:#a855f7;--ac2:#7c3aed;--tx:#ece6f5;--mu:#9b8db3;--ok:#4ade80;--er:#f87171;--wa:#fbbf24;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;margin:0}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{background:var(--bg);color:var(--tx);font:400 16px/1.55 'Chakra Petch',system-ui,sans-serif;min-height:100vh}
a{color:var(--ac)}button,input,select,textarea{font:inherit;color:inherit}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;display:flex;align-items:center;gap:6px;padding:10px 20px;background:rgba(7,4,13,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--bd);flex-wrap:wrap}
.logo{font-weight:700;font-size:20px;letter-spacing:.5px;margin-right:auto;cursor:pointer}.logo b{color:var(--ac)}
nav button.l{background:none;border:0;padding:8px 12px;border-radius:8px;color:var(--mu);cursor:pointer}
nav button.l:hover,nav button.l.on{color:#fff;background:var(--pn2)}
.btn{background:var(--ac2);border:0;padding:10px 18px;border-radius:8px;font-weight:600;cursor:pointer;color:#fff}.btn:hover{background:var(--ac)}
.btn.g{background:transparent;border:1px solid var(--bd)}.btn.g:hover{border-color:var(--ac)}.btn.s{padding:5px 10px;font-size:13px}.btn.r{background:#7f1d1d}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:1100px;margin:0 auto;padding:28px 20px 100px}
h1{font-size:clamp(34px,7vw,64px);line-height:1.05}h2{font-size:26px;margin-bottom:14px}h3{font-size:18px;margin-bottom:6px}
.hero{padding:50px 0 34px;overflow:hidden;border-bottom:1px solid var(--bd);margin-bottom:28px;background:radial-gradient(600px 260px at 15% 0,rgba(168,85,247,.28),transparent),linear-gradient(transparent 95%,rgba(168,85,247,.12) 96%) 0 0/100% 38px}
.hero h1 span{color:var(--ac);text-shadow:0 0 30px rgba(168,85,247,.6)}.hero p{color:var(--mu);max-width:560px;margin:14px 0 22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ip{background:var(--pn);border:1px solid var(--bd);padding:10px 14px;border-radius:8px;font-weight:600}
.stat{display:flex;gap:26px;margin-top:26px;flex-wrap:wrap}.stat div b{display:block;font-size:26px;color:#fff}.stat div{color:var(--mu);font-size:14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.card{background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:18px}.card p,.mu{color:var(--mu);font-size:14px}
.card.hot{border-color:var(--ac);box-shadow:0 0 24px rgba(168,85,247,.2)}
.price{font-size:26px;font-weight:700;margin:8px 0}.tag{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--pn2);border:1px solid var(--bd)}
.tag.adm{background:#4c1d95;border-color:var(--ac)}.tag.vip{background:#713f12;border-color:var(--wa);color:var(--wa)}
.wa{color:var(--wa)}.er{color:var(--er)}
form,.f{display:grid;gap:10px;max-width:440px}
input,select,textarea{background:#0c0716;border:1px solid var(--bd);border-radius:8px;padding:10px 12px;width:100%}
label{font-size:13px;color:var(--mu)}
.tabs{display:flex;gap:6px;margin-bottom:18px;flex-wrap:wrap}.tabs button{background:var(--pn);border:1px solid var(--bd);padding:8px 14px;border-radius:8px;cursor:pointer}.tabs button.on{background:var(--ac2);border-color:var(--ac)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:9px 8px;border-bottom:1px solid var(--bd);text-align:left;vertical-align:top}th{color:var(--mu);font-weight:600}
.scroll{overflow-x:auto}
.chat{height:380px;overflow-y:auto;background:var(--pn);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:10px}
.msg{padding:4px 0}.msg small{color:var(--mu);margin-right:6px}.msg.a{background:rgba(168,85,247,.12);border-left:3px solid var(--ac);padding-left:8px}
.shot{aspect-ratio:16/9;border-radius:10px;border:1px solid var(--bd);display:flex;align-items:end;padding:10px;font-size:13px;color:#fff}
.trk{display:flex;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--bd);cursor:pointer}.trk:hover b{color:var(--ac)}
.toast{position:fixed;left:50%;top:70px;transform:translateX(-50%);background:var(--ac2);padding:10px 18px;border-radius:8px;z-index:30;display:none}
.banner{padding:10px 14px;border-radius:10px;background:var(--pn2);border:1px solid var(--ac);margin-bottom:18px;font-size:14px}
footer{border-top:1px solid var(--bd);padding:20px 20px 90px;text-align:center;color:var(--mu);font-size:13px}
#pl{position:fixed;left:0;right:0;bottom:0;z-index:6;display:none;align-items:center;gap:10px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:rgba(18,10,31,.96);border-top:1px solid var(--ac);backdrop-filter:blur(8px)}
#pl .nm{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14px}#pl button{background:none;border:1px solid var(--bd);border-radius:50%;width:36px;height:36px;cursor:pointer}#pl button:hover{border-color:var(--ac)}#pl input{width:90px;padding:0}
#intro{position:fixed;inset:0;z-index:50;background:radial-gradient(700px 400px at 50% 40%,#2a1052,#07040d 70%);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;text-align:center;transition:opacity .7s}
#intro.out{opacity:0;pointer-events:none}
#intro h1{font-size:clamp(40px,10vw,96px);letter-spacing:4px;animation:rise 1.4s both}#intro h1 b{color:var(--ac);text-shadow:0 0 40px var(--ac)}
#intro p{color:var(--mu);animation:rise 1.4s .5s both}
.bar{width:min(320px,70vw);height:4px;background:var(--pn2);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--ac);box-shadow:0 0 12px var(--ac);animation:load 2.4s .8s forwards}
#intro .btn{opacity:0;animation:rise .8s 3.2s forwards;padding:14px 34px;font-size:18px}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96)}to{opacity:1;transform:none}}@keyframes load{to{width:100%}}
@media(prefers-reduced-motion:reduce){#intro *{animation-duration:.01s!important;animation-delay:0s!important}}
</style></head><body>
<div id="intro"><h1>BRASIL PLAY <b>FORTAL</b></h1><p>Roleplay SA-MP · sua história começa agora</p><div class="bar"><i></i></div><button class="btn" onclick="enter()">Entrar no servidor</button></div>
<nav id="nav"></nav><main id="m"></main>
<footer>Brasil Play Fortal RPG — servidor de Roleplay para SA-MP. Não afiliado à Rockstar Games.</footer>
<div id="pl"></div><div class="toast" id="t"></div>
<script>
let S={me:null,events:[],news:[],music:[],msgs:[],reports:[],users:[],count:0},cur='home',tab='perfil',atab='resumo';
const $=id=>document.getElementById(id),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const U=()=>S.me,adm=()=>S.me&&S.me.role==='admin',fd=e=>{e.preventDefault();return Object.fromEntries(new FormData(e.target))};
const toast=s=>{const t=$('t');t.textContent=s;t.style.display='block';clearTimeout(t.k);t.k=setTimeout(()=>t.style.display='none',2800)};
async function api(p,b){try{const r=await fetch(p,{method:b?'POST':'GET',headers:b?{'Content-Type':'application/json'}:{},body:b?JSON.stringify(b):undefined});return await r.json()}catch(e){return{err:'Sem conexão com o servidor.'}}}
async function load(r){const s=await api('/api/state');if(s.err)return toast(s.err);S=s;initMusic();nav();if(r)go(cur,1)}
async function act(t,b,ok){if(!U()){toast('Entre na sua conta primeiro.');go('login');return 0}const r=await api('/api/act',{t,...b});if(r.err){toast(r.err);return 0}if(ok)toast(ok);await load(1);return 1}
function go(v,keep){cur=v;nav();$('m').innerHTML=V[v]();if(v==='chat'){const c=$('c');c.scrollTop=c.scrollHeight;const i=document.querySelector('#m input[name=x]');if(i&&keep)i.focus()}if(!keep)scrollTo(0,0)}
function nav(){const u=U(),L=[['home','Início'],['info','Informações'],['eventos','Eventos'],['midia','Mídia'],['loja','Loja'],['chat','Chat global'],['denuncia','Denúncia']];
$('nav').innerHTML=`<div class="logo" onclick="go('home')">BRASIL PLAY <b>FORTAL</b> RPG</div>`+L.map(a=>`<button class="l ${cur===a[0]?'on':''}" onclick="go('${a[0]}')">${a[1]}</button>`).join('')+
(u?`<button class="btn s" onclick="go('${adm()?'admin':'ucp'}')">${adm()?'Painel Admin':'UCP'} · ${esc(u.u)}</button><button class="btn g s" onclick="out()">Sair</button>`:`<button class="btn g s" onclick="go('login')">Entrar</button><button class="btn s" onclick="go('registro')">Criar conta</button>`)}
async function out(){await api('/api/logout',{});S.me=null;toast('Você saiu da conta.');go('home')}
const chatH=()=>S.msgs.map(m=>`<div class="msg ${m.r==='admin'?'a':''}"><small>${esc(m.u)}</small>${m.r==='admin'?'<span class="tag adm">STAFF</span> ':m.v?'<span class="tag vip">VIP</span> ':''}${esc(m.x)}</div>`).join('');
const V={
home(){return `<div class="hero"><h1>Sua história começa<br>em <span>Fortal</span></h1><p>Servidor de roleplay sério para SA-MP: economia realista, facções, empregos legais e ilegais, staff presente.</p>
<div class="row"><div class="ip">samp.brasilplayfortal.com.br:7777</div><button class="btn" onclick="navigator.clipboard&&navigator.clipboard.writeText('samp.brasilplayfortal.com.br:7777');toast('IP copiado!')">Copiar IP</button><button class="btn g" onclick="go('${U()?(adm()?'admin':'ucp'):'registro'}')">${U()?'Abrir meu painel':'Criar conta'}</button></div>
<div class="stat"><div><b>${S.count}</b>contas registradas</div><div><b>${S.events.length}</b>eventos agendados</div><div><b>24h</b>staff ativa</div><div><b>v0.3.7</b>cliente SA-MP</div></div></div>
<h2>Novidades</h2><div class="grid">${S.news.map(n=>`<div class="card"><h3>${esc(n.t)}</h3><p>${esc(n.x)}</p></div>`).join('')}</div>
<h2 style="margin-top:28px">Como entrar</h2><div class="grid"><div class="card"><h3>1. Crie sua conta</h3><p>Registre-se aqui no site com usuário e senha.</p></div><div class="card"><h3>2. Baixe o SA-MP</h3><p>Instale o cliente 0.3.7 e conecte no IP acima.</p></div><div class="card"><h3>3. Entre com o mesmo login</h3><p>Use o usuário e senha do site dentro do jogo.</p></div></div>`},
info(){return `<h2>Informações do servidor</h2><div class="grid"><div class="card"><h3>Regras gerais</h3><p>Proibido DM, RDM, VDM, Metagaming e Powergaming. Respeite o roleplay e a staff. Sem cheats ou bugs abusivos.</p></div><div class="card"><h3>Facções legais</h3><p>Polícia Militar, SAMU, Bombeiros, Prefeitura e Mecânicos. Recrutamento por eventos.</p></div><div class="card"><h3>Facções ilegais</h3><p>Gangues, máfias e cartéis. Exigem história de personagem aprovada.</p></div><div class="card"><h3>Economia</h3><p>Empregos, empresas, imóveis, veículos e banco. Moedas VIP não compram vantagem de combate.</p></div><div class="card"><h3>Comandos úteis</h3><p>/ajuda, /report, /rg, /celular, /banco, /inventario</p></div><div class="card"><h3>Discord e suporte</h3><p>discord.gg/brasilplayfortal — abra ticket para dúvidas, revisão de punição e problemas de compra.</p></div></div>`},
eventos(){return `<h2>Eventos</h2><div class="grid">${S.events.map(e=>`<div class="card"><span class="tag">${esc(e.d.split('-').reverse().join('/'))} às ${esc(e.h)}</span><h3 style="margin-top:8px">${esc(e.t)}</h3><p>${esc(e.x)}</p></div>`).join('')||'<p class="mu">Nenhum evento agendado.</p>'}</div>`},
midia(){const g=['#7c3aed,#1e0b3a','#a855f7,#0d0518','#4c1d95,#000','#c026d3,#1e0b3a','#6d28d9,#07040d','#9333ea,#000'],n=['Praia de Santa Maria','Batalha de gangues','Concessionária Premium','Patrulha da PM','Noite na Downtown','Garagem de tuning'];
return `<h2>Playlist do servidor</h2><div style="margin-bottom:28px">${S.music.map((m,i)=>`<div class="trk" onclick="play(${i})"><span>▶</span><b>${esc(m.t)}</b></div>`).join('')||'<p class="mu">Nenhuma música ainda. A administração adiciona pelo painel.</p>'}</div>
<h2>Mídia</h2><p class="mu" style="margin-bottom:14px">Capturas de tela e vídeos da comunidade. Envie os seus no canal #midia do Discord.</p><div class="grid">${g.map((c,i)=>`<div class="shot" style="background:linear-gradient(135deg,${c})">${n[i]}</div>`).join('')}</div>`},
loja(){const u=U(),P=[[100,5],[300,12],[700,25],[1500,45]],VV=[['Bronze',300],['Prata',700],['Ouro',1200]];
return `<h2>Loja</h2>${u?`<div class="banner">Seu saldo: <b>${u.coins} moedas</b> · VIP: <b>${u.vip||'nenhum'}</b></div>`:`<div class="banner">Entre na conta para comprar.</div>`}
<h3>Moedas</h3><div class="grid" style="margin-bottom:24px">${P.map((p,i)=>`<div class="card ${i==2?'hot':''}"><h3>${p[0]} moedas</h3><div class="price">R$ ${p[1]},00</div><button class="btn" onclick="act('buyC',{n:${p[0]}},'${p[0]} moedas adicionadas!')">Comprar via PIX</button></div>`).join('')}</div>
<h3>VIPs (30 dias, pagos com moedas)</h3><div class="grid">${VV.map((v,i)=>`<div class="card ${i==2?'hot':''}"><h3>VIP ${v[0]}</h3><div class="price">${v[1]} moedas</div><p>Fila prioritária, veículo exclusivo, tag no chat${i>0?', salário extra':''}${i>1?', imóvel bônus':''}.</p><br><button class="btn" onclick="act('buyV',{n:'${v[0]}'},'VIP ${v[0]} ativado!')">Ativar VIP</button></div>`).join('')}</div><p class="mu" style="margin-top:14px">Pagamento em modo demonstração: nenhuma cobrança real é feita.</p>`},
chat(){return `<h2>Chat global</h2><div class="chat" id="c">${chatH()}</div><form onsubmit="say(event)" style="max-width:none;grid-template-columns:1fr auto"><input name="x" maxlength="200" placeholder="${U()?'Escreva uma mensagem...':'Entre para conversar'}" autocomplete="off"><button class="btn">Enviar</button></form>`},
denuncia(){return `<h2>Denúncia</h2><form onsubmit="rep(event)"><div><label>Tipo</label><select name="tp"><option>RDM / DM</option><option>VDM</option><option>Metagaming</option><option>Powergaming</option><option>Cheater</option><option>Ofensa / Toxicidade</option><option>Bug abusivo</option><option>Outro</option></select></div><div><label>Nick do jogador denunciado</label><input name="al" required maxlength="30"></div><div><label>Data e hora do ocorrido</label><input name="dh" required placeholder="16/11 às 21:30"></div><div><label>Descrição</label><textarea name="ds" rows="4" required></textarea></div><div><label>Link da prova (vídeo ou imagem)</label><input name="pf" required placeholder="https://"></div><button class="btn">Enviar denúncia</button></form><p class="mu" style="margin-top:12px">Acompanhe o andamento no seu UCP.</p>`},
login(){return `<h2>Entrar</h2><form onsubmit="lg(event)"><div><label>Usuário</label><input name="u" required></div><div><label>Senha</label><input name="p" type="password" required></div><button class="btn">Entrar</button><span class="mu">Sem conta? <a href="#" onclick="go('registro');return false">Criar conta</a></span></form>`},
registro(){return `<h2>Criar conta</h2><form onsubmit="rg(event)"><div><label>Usuário (3 a 20 letras, números ou _)</label><input name="u" required pattern="[A-Za-z0-9_]{3,20}"></div><div><label>E-mail</label><input name="e" type="email" required></div><div><label>Senha (mínimo 6)</label><input name="p" type="password" required minlength="6"></div><div><label>Repetir senha</label><input name="p2" type="password" required></div><label><input type="checkbox" required style="width:auto"> Li e aceito as regras do servidor</label><button class="btn">Criar conta</button></form>`},
ucp(){const u=U();if(!u)return V.login();const T=['perfil','personagens','compras','denúncias','senha'];let b='';
if(tab==='perfil')b=`<div class="grid"><div class="card"><p>Usuário</p><h3>${esc(u.u)}</h3></div><div class="card"><p>Moedas</p><h3>${u.coins}</h3></div><div class="card"><p>VIP</p><h3>${u.vip||'Nenhum'}</h3></div><div class="card"><p>Personagens</p><h3>${u.chars.length}/3</h3></div></div>`;
if(tab==='personagens')b=`<div class="grid" style="margin-bottom:16px">${u.chars.map(c=>`<div class="card"><h3>${esc(c.n)}</h3><p>Nível 1 · ${c.s} · criado em ${c.d}</p><p class="wa">Aguardando whitelist</p></div>`).join('')||'<p class="mu">Nenhum personagem ainda.</p>'}</div><form onsubmit="ch(event)"><div><label>Nome_Sobrenome</label><input name="n" required pattern="[A-Z][a-z]+_[A-Z][a-z]+" title="Ex: Carlos_Silva"></div><div><label>Sexo</label><select name="s"><option>Masculino</option><option>Feminino</option></select></div><button class="btn">Criar personagem</button></form>`;
if(tab==='compras')b=`<div class="scroll"><table><tr><th>Data</th><th>Item</th><th>Valor</th></tr>${u.buys.map(x=>`<tr><td>${x.d}</td><td>${esc(x.i)}</td><td>${esc(x.v)}</td></tr>`).join('')||'<tr><td colspan=3 class="mu">Sem compras.</td></tr>'}</table></div>`;
if(tab==='denúncias')b=`<div class="scroll"><table><tr><th>#</th><th>Contra</th><th>Tipo</th><th>Status</th></tr>${S.reports.map(r=>`<tr><td>${r.id}</td><td>${esc(r.al)}</td><td>${esc(r.tp)}</td><td>${r.st}</td></tr>`).join('')||'<tr><td colspan=4 class="mu">Nenhuma denúncia.</td></tr>'}</table></div>`;
if(tab==='senha')b=PW();
return `<h2>UCP — Painel do jogador</h2><div class="tabs">${T.map(t=>`<button class="${tab===t?'on':''}" onclick="tab='${t}';go('ucp')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${b}`},
admin(){if(!adm())return V.login();const T=['resumo','denúncias','jogadores','eventos','anúncios','músicas','senha'];let b='';
if(atab==='resumo')b=`<div class="grid"><div class="card"><p>Contas</p><h3>${S.count}</h3></div><div class="card"><p>Denúncias abertas</p><h3>${S.reports.filter(r=>r.st==='Aberta'||r.st==='Em análise').length}</h3></div><div class="card"><p>Compras</p><h3>${S.sales}</h3></div><div class="card"><p>VIPs ativos</p><h3>${S.vips}</h3></div></div>`;
if(atab==='denúncias')b=`<div class="scroll"><table><tr><th>#</th><th>Autor</th><th>Contra</th><th>Detalhes</th><th>Status</th></tr>${S.reports.map(r=>`<tr><td>${r.id}</td><td>${esc(r.by)}</td><td>${esc(r.al)}<br><span class="tag">${esc(r.tp)}</span></td><td>${esc(r.ds)}<br><span class="mu">${esc(r.dh)}</span> <a href="${/^https?:/.test(r.pf)?esc(r.pf):'#'}" target="_blank" rel="noopener">prova</a></td><td><select onchange="act('rs',{id:${r.id},st:this.value},'Status atualizado.')">${['Aberta','Em análise','Resolvida','Rejeitada'].map(s=>`<option ${s===r.st?'selected':''}>${s}</option>`).join('')}</select></td></tr>`).join('')||'<tr><td colspan=5 class="mu">Sem denúncias.</td></tr>'}</table></div>`;
if(atab==='jogadores')b=`<div class="scroll"><table><tr><th>Usuário</th><th>Cargo</th><th>Moedas</th><th>Ações</th></tr>${S.users.map(u=>`<tr><td>${esc(u.u)} ${u.ban?'<span class="tag er">banido</span>':''}</td><td>${u.role}</td><td>${u.coins}</td><td>${u.role==='admin'?'—':`<button class="btn s g" onclick="act('gv',{u:'${u.u}'},'+100 moedas')">+100 moedas</button> <button class="btn s ${u.ban?'g':'r'}" onclick="act('bn',{u:'${u.u}'})">${u.ban?'Desbanir':'Banir'}</button> <button class="btn s g" onclick="act('mk',{u:'${u.u}'},'Promovido a admin.')">Promover</button>`}</td></tr>`).join('')}</table></div>`;
if(atab==='eventos')b=`<form onsubmit="ev(event)"><div><label>Título</label><input name="t" required></div><div class="row"><input name="d" type="date" required style="flex:1"><input name="h" type="time" required style="flex:1"></div><div><label>Descrição</label><textarea name="x" required></textarea></div><button class="btn">Criar evento</button></form><div class="scroll" style="margin-top:16px"><table>${S.events.map(e=>`<tr><td>${esc(e.t)}</td><td>${esc(e.d)}</td><td><button class="btn s r" onclick="act('evDel',{id:${e.id}})">Remover</button></td></tr>`).join('')}</table></div>`;
if(atab==='anúncios')b=`<form onsubmit="nw(event)"><div><label>Título</label><input name="t" required></div><div><label>Texto</label><textarea name="x" required></textarea></div><button class="btn">Publicar na página inicial</button></form>`;
if(atab==='músicas')b=`<form onsubmit="mu(event)"><div><label>Nome da música</label><input name="t" required maxlength="80"></div><div><label>Enviar arquivo (mp3, ogg, wav, m4a — até 25 MB)</label><input name="f" type="file" accept="audio/*"></div><div><label>ou link direto do áudio</label><input name="url" placeholder="https://site.com/musica.mp3"></div><button class="btn">Adicionar à playlist</button></form><div style="margin-top:16px">${S.music.map(m=>`<div class="trk" style="cursor:default"><b style="flex:1">${esc(m.t)}</b><button class="btn s r" onclick="act('muDel',{id:${m.id}},'Música removida.')">Remover</button></div>`).join('')||'<p class="mu">Playlist vazia.</p>'}</div>`;
if(atab==='senha')b=PW();
return `<h2>Painel da administração</h2><div class="tabs">${T.map(t=>`<button class="${atab===t?'on':''}" onclick="atab='${t}';go('admin')">${t[0].toUpperCase()+t.slice(1)}</button>`).join('')}</div>${b}`}};
const PW=()=>`<form onsubmit="pw(event)"><div><label>Senha atual</label><input name="a" type="password" required></div><div><label>Nova senha (mínimo 6)</label><input name="n" type="password" minlength="6" required></div><button class="btn">Alterar senha</button></form>`;
async function lg(e){const r=await api('/api/login',fd(e));if(r.err)return toast(r.err);await load();toast('Bem-vindo, '+U().u+'!');go(adm()?'admin':'ucp')}
async function rg(e){const f=fd(e);if(f.p!==f.p2)return toast('As senhas não coincidem.');const r=await api('/api/register',f);if(r.err)return toast(r.err);await load();toast('Conta criada! Você ganhou 50 moedas.');go('ucp')}
const say=async e=>{const f=fd(e);if(f.x.trim())await act('say',f)};
const rep=async e=>{const f=fd(e);if(await act('rep',f,'Denúncia enviada! Acompanhe pelo UCP.'))e.target.reset()};
const ch=async e=>{await act('ch',fd(e),'Personagem criado!')},pw=async e=>{const f=fd(e);if(await act('pw',f,'Senha alterada!'))e.target.reset()};
const ev=async e=>{await act('ev',fd(e),'Evento criado!')},nw=async e=>{await act('nw',fd(e),'Anúncio publicado!')};
async function mu(e){e.preventDefault();const f=e.target,file=f.f.files[0];let url=f.url.value.trim();
if(file){toast('Enviando arquivo...');try{const r=await(await fetch('/api/upload',{method:'POST',headers:{'x-filename':encodeURIComponent(file.name)},body:file})).json();if(r.err)return toast(r.err);url=r.url}catch(x){return toast('Falha no envio.')}}
await act('muAdd',{t:f.t.value,url},'Música adicionada!')}
/* música */
const au=new Audio();let mi=0,MV=.6;au.preload='none';try{const m=JSON.parse(localStorage.getItem('mus'));if(m&&m.v>=0)MV=m.v}catch(e){}au.volume=MV;
au.onended=()=>play(mi+1);au.onplay=au.onpause=()=>bar();
function initMusic(){if(!S.music.length){au.pause();au.removeAttribute('src');$('pl').style.display='none';return}if(!au.getAttribute('src')){mi=0;au.src=S.music[0].url}bar()}
function play(i){if(!S.music.length)return;const n=S.music.length;mi=(i%n+n)%n;au.src=S.music[mi].url;au.play().catch(()=>toast('Não foi possível tocar esta música.'));bar()}
function tg(){au.paused?au.play().catch(()=>{}):au.pause()}
function vol(v){au.volume=v;try{localStorage.setItem('mus',JSON.stringify({v:+v}))}catch(e){}}
function bar(){const p=$('pl'),m=S.music[mi];if(!m){p.style.display='none';return}p.style.display='flex';
const k=m.id+'|'+au.paused;if(p.k===k)return;p.k=k;p.innerHTML=`<button onclick="play(mi-1)" aria-label="Anterior">⏮</button><button onclick="tg()" aria-label="Tocar ou pausar">${au.paused?'▶':'⏸'}</button><button onclick="play(mi+1)" aria-label="Próxima">⏭</button><div class="nm">♪ ${esc(m.t)}</div><input type="range" min="0" max="1" step=".05" value="${au.volume}" oninput="vol(this.value)" aria-label="Volume">`}
/* intro */
function enter(){$('intro').classList.add('out');try{sessionStorage.setItem('intro','1')}catch(e){}setTimeout(()=>$('intro').remove(),800);if(S.music.length)play(0)}
try{if(sessionStorage.getItem('intro'))$('intro').remove()}catch(e){}
setInterval(async()=>{if(cur==='chat'&&$('c')&&document.visibilityState==='visible'){const s=await api('/api/state');if(s.msgs){const c=$('c'),end=c.scrollHeight-c.scrollTop-c.clientHeight<40;S.msgs=s.msgs;c.innerHTML=chatH();if(end)c.scrollTop=c.scrollHeight}}},5000);
load().then(()=>go('home'));
</script></body></html>
